server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 100ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only Docker Compose containers (they have the compose service label)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: .+
        action: keep
      # Map compose service name → "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Map compose project name → "project" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
      # Strip leading slash from container name
      - source_labels: [__meta_docker_container_name]
        regex: '/(.+)'
        target_label: container
      # stdout vs stderr
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      # Parse structured JSON logs from backend and worker (pino format).
      # Extracts "level" as a low-cardinality index label and parses the
      # embedded ISO timestamp so Loki uses log time, not ingestion time.
      - match:
          selector: '{service=~"backend|worker"}'
          stages:
            - json:
                expressions:
                  level: level
                  time: time
            - labels:
                level:
            - timestamp:
                source: time
                format: RFC3339Nano
                action_on_failure: skip

      # Infrastructure services (postgres, redis, mailhog) emit plain text.
      # Attempt a best-effort level extraction so error lines are filterable.
      - match:
          selector: '{service!~"backend|worker"}'
          stages:
            - regex:
                expression: '(?i)(?P<level>FATAL|ERROR|WARN|WARNING|INFO|DEBUG)'
            - labels:
                level:

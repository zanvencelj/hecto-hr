# Production compose — pull-only, no build contexts.
# Images are built and pushed by scripts/deploy/build-and-push.sh (run locally,
# from a full checkout); this file only pulls and runs them.
#
# First-time / after a new image tag:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# One-off jobs (not started by `up -d`, profile-gated):
#   docker compose -f docker-compose.prod.yml run --rm seed
#   docker compose -f docker-compose.prod.yml run --rm superadmin-create <email> <password>
#
# See docs/deployment.md for the full VPS setup walkthrough.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend-image: &backend-image
  image: ${REGISTRY:-ghcr.io/zanvencelj}/hectohr-backend:${IMAGE_TAG:-latest}
  <<: *default-logging

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hectohr}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_TLS: ${REDIS_TLS:-}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@hectohr.com}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  # ── Edge ─────────────────────────────────────────────────────────────────────

  web:
    image: ${REGISTRY:-ghcr.io/zanvencelj}/hectohr-web:${IMAGE_TAG:-latest}
    <<: *default-logging
    ports:
      - "80:80"
      - "443:443"
    # Some hosts hand containers a resolv.conf pointing at the host's
    # systemd-resolved stub (127.0.0.53), which isn't reachable from inside a
    # container's own network namespace — breaks every outbound DNS lookup,
    # which for this service means every ACME (cert) request. Pin real public
    # resolvers so cert issuance doesn't depend on the host's DNS setup.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@hectohr.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    <<: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hectohr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-hectohr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *default-logging
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    <<: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    # Port 9000 (S3 API) is reached by both `web` (public, via files.hectohr.com)
    # and `backend` (presigning) over the internal compose network — no publish
    # needed. Console (9001) is loopback-only; tunnel over SSH to reach it:
    #   ssh -L 9001:localhost:9001 <deploy-host>
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    <<: *default-logging
    entrypoint: ["/bin/sh", "/scripts/nightly-loop.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hectohr}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - db_backups:/backups
      - ./scripts/backup/nightly-loop.sh:/scripts/nightly-loop.sh:ro
      - ./libs/backend/database/scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── App ──────────────────────────────────────────────────────────────────────

  migrate:
    image: ${REGISTRY:-ghcr.io/zanvencelj}/hectohr-migrator:${IMAGE_TAG:-latest}
    <<: *default-logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hectohr}
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3

  backend:
    <<: *backend-image
    # Loopback-only direct access for debugging; public access goes through
    # `web` (Caddy) via the same-origin /api proxy on app.hectohr.com and
    # admin.hectohr.com — see deploy/Caddyfile.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      <<: *backend-env
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: backend
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?EMAIL_VERIFICATION_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.hectohr.com,https://admin.hectohr.com}
      APP_URL: ${APP_URL:-https://app.hectohr.com}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://files.hectohr.com}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-hectohr}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    <<: *backend-image
    command: ["node", "worker.js"]
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      <<: *backend-env
      NODE_ENV: production
      SERVICE_NAME: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(Number(process.env.REDIS_PORT||6379),process.env.REDIS_HOST||'redis').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One-off jobs — never started by `up -d` (profile-gated). Run explicitly:
  #   docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    <<: *backend-image
    profiles: ["tools"]
    command: ["node", "seed.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hectohr}
    depends_on:
      migrate:
        condition: service_completed_successfully

  #   docker compose -f docker-compose.prod.yml run --rm superadmin-create <email> <password>
  superadmin-create:
    <<: *backend-image
    profiles: ["tools"]
    entrypoint: ["node", "create-superadmin.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hectohr}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ── Monitoring ───────────────────────────────────────────────────────────────
  # Not exposed on hectohr.com/app.hectohr.com/admin.hectohr.com — no cert or
  # DNS is provisioned for these. Reach them over an SSH tunnel, e.g.:
  #   ssh -L 3001:localhost:3001 <deploy-host>   # Grafana at http://localhost:3001

  loki:
    image: grafana/loki:3.4
    <<: *default-logging
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4
    <<: *default-logging
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6
    <<: *default-logging
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  db_backups:
  redis_data:
  minio_data:
  loki_data:
  grafana_data:
  caddy_data:
  caddy_config:
